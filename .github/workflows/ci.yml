name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The whole matrix on Linux: lint/types, unit tests, every framework headless against the real
  # library, and the terminal scenario in a pseudo-terminal.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/pty/requirements.txt

      - name: Install
        run: |
          npm ci
          npm run test:setup
          pip install -r tests/pty/requirements.txt

      - name: Types
        run: npx tsc --noEmit -p .

      - name: Tests (headless, every framework)
        run: npx vitest run --maxWorkers=2 --exclude tests/pty.test.ts

      - name: Terminal tests (real tty)
        run: npx vitest run tests/pty.test.ts
